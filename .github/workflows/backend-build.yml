name: Build Backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-*.yml'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  build_backend:
    name: Build Backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Matches the newest Node.js the o2switch "Setup Node.js App" selector offers.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Mongoose is mocked in __tests__/setup.ts, so the suite needs no database.
      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # The deploy installs production dependencies on the server from these.
      - name: Copy package.json and package-lock.json to dist
        run: |
          cp package.json dist/
          cp package-lock.json dist/

      - name: Upload Build Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: backend-build
          path: backend/dist
